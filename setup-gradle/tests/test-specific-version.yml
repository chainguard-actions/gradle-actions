name: Test setup-gradle with specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure Java is available
        run: |
          java -version 2>&1 || (sudo apt-get update -q && sudo apt-get install -y -q default-jdk)
          java -version

      - id: setup
        uses: .
        with:
          gradle-version: '8.5'
          cache-disabled: 'true'

      - name: Assert gradle-version output matches requested version
        env:
          GRADLE_VERSION: ${{ steps.setup.outputs.gradle-version }}
        run: |
          echo "gradle-version: $GRADLE_VERSION"
          if [ -z "$GRADLE_VERSION" ]; then
            echo "FAIL: gradle-version output is empty"
            exit 1
          fi
          if [ "$GRADLE_VERSION" != "8.5" ]; then
            echo "FAIL: expected gradle-version '8.5' but got '$GRADLE_VERSION'"
            exit 1
          fi
          echo "PASS: gradle-version=$GRADLE_VERSION"

      - name: Assert gradle binary works
        run: |
          echo "Running: gradle --version"
          gradle --version
          echo "PASS: gradle --version succeeded"

      - name: Assert gradle version matches via CLI
        run: |
          VERSION_OUTPUT=$(gradle --version 2>&1)
          echo "gradle --version output: $VERSION_OUTPUT"
          if echo "$VERSION_OUTPUT" | grep -q "Gradle 8.5"; then
            echo "PASS: gradle CLI reports version 8.5"
          else
            echo "FAIL: gradle CLI did not report version 8.5"
            echo "Full output: $VERSION_OUTPUT"
            exit 1
          fi
