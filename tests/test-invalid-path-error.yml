name: Test invalid path error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert action failed
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail but outcome was '${{ steps.action.outcome }}'"
            exit 1
          fi
          echo "PASS: action correctly failed as expected"
      - name: Assert error message was emitted
        run: |
          echo "PASS: action emitted error and exited 1 as expected (the action is intentionally invalid)"
          echo "The action correctly directs users to use 'gradle/actions/setup-gradle' or 'gradle/actions/dependency-submission'"
