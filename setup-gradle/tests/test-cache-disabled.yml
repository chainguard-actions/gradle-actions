name: Test setup-gradle with cache disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure Java is available
        run: |
          java -version 2>&1 || (sudo apt-get update -q && sudo apt-get install -y -q default-jdk)
          java -version

      - id: setup
        uses: .
        with:
          gradle-version: '8.6'
          cache-disabled: 'true'

      - name: Assert gradle-version output is set and correct
        env:
          GRADLE_VERSION: ${{ steps.setup.outputs.gradle-version }}
        run: |
          echo "gradle-version: $GRADLE_VERSION"
          if [ -z "$GRADLE_VERSION" ]; then
            echo "FAIL: gradle-version output is empty"
            exit 1
          fi
          if [ "$GRADLE_VERSION" != "8.6" ]; then
            echo "FAIL: expected '8.6' but got '$GRADLE_VERSION'"
            exit 1
          fi
          echo "PASS: gradle-version=$GRADLE_VERSION"

      - name: Run gradle --version to confirm binary works
        run: |
          gradle --version
          echo "PASS: gradle --version succeeded"
