name: Test cache configuration inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          cache-disabled: 'true'
          cache-encryption-key: 'dGVzdGtleWZvcmVuY3J5cHRpb24xMjM='
          cache-cleanup: 'never'
          gradle-home-cache-cleanup: 'false'
          gradle-home-cache-excludes: |
            wrapper/dists
          validate-wrappers: 'false'
        continue-on-error: true
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.setup.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
