name: Test allow-checksums with custom wrapper
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Compute checksum of fixture wrapper
        id: setup
        run: |
          FIXTURE="$GITHUB_WORKSPACE/tests/fixtures/gradle/wrapper/gradle-wrapper.jar"
          if [ ! -f "$FIXTURE" ]; then
            echo "FAIL: fixture not found at $FIXTURE"
            exit 1
          fi
          CHECKSUM=$(sha256sum "$FIXTURE" | awk '{print $1}')
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"
          echo "Fixture checksum: $CHECKSUM"
      - id: action
        uses: .
        with:
          min-wrapper-count: '1'
          allow-checksums: ${{ steps.setup.outputs.checksum }}
        continue-on-error: true
      - name: Assert action succeeded with custom checksum
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FAILED: ${{ steps.action.outputs.failed-wrapper }}
        run: |
          echo "outcome: $OUTCOME"
          echo "failed-wrapper: '$FAILED'"
          if [ "$OUTCOME" = "success" ]; then
            if [ -n "$FAILED" ]; then
              echo "FAIL: action succeeded but failed-wrapper is set: $FAILED"
              exit 1
            fi
            echo "PASS: custom checksum was accepted, no failed wrappers"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (allow-checksums may not override network-fetched list in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
