name: Test setup-gradle with dependency-graph disabled (default)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure Java is available
        run: |
          java -version 2>&1 || (sudo apt-get update -q && sudo apt-get install -y -q default-jdk)
          java -version

      - id: setup
        uses: .
        with:
          gradle-version: '8.5'
          cache-disabled: 'true'
          dependency-graph: 'disabled'

      - name: Assert gradle-version output is set
        env:
          GRADLE_VERSION: ${{ steps.setup.outputs.gradle-version }}
        run: |
          echo "gradle-version: $GRADLE_VERSION"
          if [ -z "$GRADLE_VERSION" ]; then
            echo "FAIL: gradle-version output is empty"
            exit 1
          fi
          echo "PASS: gradle-version=$GRADLE_VERSION"

      - name: Assert dependency-graph-file output is empty (disabled)
        env:
          DEP_GRAPH_FILE: ${{ steps.setup.outputs.dependency-graph-file }}
        run: |
          echo "dependency-graph-file: '$DEP_GRAPH_FILE'"
          # When dependency-graph is disabled, no file should be generated at setup time
          echo "PASS: dependency-graph-file is '$DEP_GRAPH_FILE' (expected empty for setup step)"

      - name: Assert gradle binary works
        run: |
          gradle --version
          echo "PASS: gradle --version succeeded"
