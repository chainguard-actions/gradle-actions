name: Test deprecated arguments and build-root-directory inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create minimal Gradle wrapper project
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-project/gradle/wrapper"
          cat > "$GITHUB_WORKSPACE/test-project/settings.gradle" << 'EOF'
          rootProject.name = 'test-project'
          EOF
          cat > "$GITHUB_WORKSPACE/test-project/build.gradle" << 'EOF'
          plugins {
              id 'base'
          }
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          gradle-version: '8.7'
          cache-disabled: true
          build-root-directory: test-project
          arguments: '--version'
      - name: Assert action ran (deprecated arguments input exercised)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          GRADLE_VERSION: ${{ steps.action.outputs.gradle-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "gradle-version: $GRADLE_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$GRADLE_VERSION" ]; then
              echo "FAIL: action succeeded but gradle-version output is empty"
              exit 1
            fi
            echo "PASS: gradle-version=$GRADLE_VERSION"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (deprecated arguments path)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
