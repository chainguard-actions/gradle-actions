name: Test invalid dependency-graph option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          gradle-version: '8.10.2'
          build-root-directory: tests/fixtures/gradle-project
          dependency-graph: not-a-valid-option
          cache-disabled: 'true'
          add-job-summary: never
      - name: Assert action failed on invalid option
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid dependency-graph value"
            exit 1
          fi
          echo "PASS"
