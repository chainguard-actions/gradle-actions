name: Test build-scan and deprecated build-scan-terms-of-service inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal Gradle wrapper project
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-project"
          cd "$GITHUB_WORKSPACE/test-project"
          cat > settings.gradle << 'EOF'
          rootProject.name = 'test-project'
          EOF
          cat > build.gradle << 'EOF'
          plugins {
              id 'java'
          }
          repositories {
              mavenCentral()
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          gradle-version: '8.5'
          build-root-directory: test-project
          build-scan-publish: 'true'
          build-scan-terms-of-use-url: 'https://gradle.com/terms-of-service'
          build-scan-terms-of-use-agree: 'yes'
          build-scan-terms-of-service-url: 'https://gradle.com/terms-of-service'
          build-scan-terms-of-service-agree: 'yes'
          dependency-graph-continue-on-failure: 'true'
          cache-disabled: 'true'

      - name: Assert action ran with build-scan inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BUILD_SCAN_URL: ${{ steps.action.outputs.build-scan-url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "build-scan-url: $BUILD_SCAN_URL"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
