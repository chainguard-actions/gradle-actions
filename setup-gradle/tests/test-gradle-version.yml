name: Test gradle-version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          gradle-version: '8.5'
          cache-disabled: true
          validate-wrappers: false
      - name: Assert gradle-version output
        env:
          GRADLE_VERSION: ${{ steps.setup.outputs.gradle-version }}
        run: |
          echo "gradle-version output: $GRADLE_VERSION"
          if [ -z "$GRADLE_VERSION" ]; then
            echo "FAIL: gradle-version output is empty"
            exit 1
          fi
          echo "PASS: gradle-version output is '$GRADLE_VERSION'"
      - name: Assert gradle is on PATH
        run: |
          if ! command -v gradle &>/dev/null; then
            echo "FAIL: gradle not found on PATH"
            exit 1
          fi
          echo "PASS: gradle found at $(command -v gradle)"
