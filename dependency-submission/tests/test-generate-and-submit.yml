name: Test generate-and-submit mode (default)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up minimal Gradle project
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-project/gradle/wrapper"
          cd "$GITHUB_WORKSPACE/test-project"

          printf 'rootProject.name = "test-project"\n' > settings.gradle

          printf 'plugins { id "java" }\nrepositories { mavenCentral() }\ndependencies { implementation "org.slf4j:slf4j-api:1.7.36" }\n' > build.gradle

          printf 'distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\ndistributionUrl=https\\://services.gradle.org/distributions/gradle-8.5-bin.zip\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\n' > gradle/wrapper/gradle-wrapper.properties

          printf '#!/bin/sh\nexec gradle "$@"\n' > gradlew
          chmod +x gradlew

      - id: action
        uses: .
        with:
          build-root-directory: test-project
          gradle-version: '8.5'
          dependency-graph: 'generate-and-submit'
          dependency-graph-continue-on-failure: 'true'
          cache-disabled: 'true'
          add-job-summary: 'never'
        continue-on-error: true

      - name: Assert action ran (success or graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          GRAPH_FILE: ${{ steps.action.outputs.dependency-graph-file }}
          GRADLE_VERSION: ${{ steps.action.outputs.gradle-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "dependency-graph-file: $GRAPH_FILE"
          echo "gradle-version: $GRADLE_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo not resolvable for Dependency Submission API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
