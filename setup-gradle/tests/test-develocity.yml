name: Test develocity inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          cache-disabled: true
          validate-wrappers: false
          develocity-injection-enabled: true
          develocity-url: 'https://develocity.example.com'
          develocity-allow-untrusted-server: false
          develocity-capture-file-fingerprints: false
          develocity-enforce-url: false
          develocity-plugin-version: '3.16.2'
          develocity-ccud-plugin-version: '2.0'
          develocity-access-key: 'fake-access-key-for-testing'
          develocity-token-expiry: '2'
        continue-on-error: true
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with develocity inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
