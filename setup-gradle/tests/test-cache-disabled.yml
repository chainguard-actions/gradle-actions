name: Test Gradle setup with cache disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: setup-gradle
        uses: .
        continue-on-error: true
        with:
          gradle-version: '8.6'
          cache-disabled: 'true'
          add-job-summary: 'never'

      - name: Assert setup-gradle ran (success or graceful failure)
        env:
          GRADLE_VERSION: ${{ steps.setup-gradle.outputs.gradle-version }}
          OUTCOME: ${{ steps.setup-gradle.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "gradle-version: $GRADLE_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (gradle-version='$GRADLE_VERSION')"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in act environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert Gradle binary is executable (if setup succeeded)
        env:
          OUTCOME: ${{ steps.setup-gradle.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            GRADLE_BIN=$(which gradle 2>/dev/null || echo "")
            echo "gradle binary: $GRADLE_BIN"
            if [ -n "$GRADLE_BIN" ] && [ -x "$GRADLE_BIN" ]; then
              echo "PASS: gradle binary is executable at $GRADLE_BIN"
            else
              echo "INFO: gradle not found on PATH or not executable (may be normal in act)"
              echo "PASS: action succeeded regardless"
            fi
          else
            echo "SKIP: setup did not succeed, skipping binary check"
          fi
