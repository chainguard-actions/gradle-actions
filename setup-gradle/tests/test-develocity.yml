name: Test Develocity configuration inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        continue-on-error: true
        with:
          gradle-version: '8.7'
          cache-disabled: true
          add-job-summary: 'never'
          develocity-injection-enabled: 'false'
          develocity-url: 'https://develocity.example.com'
          develocity-allow-untrusted-server: 'false'
          develocity-access-key: ''
          develocity-token-expiry: '2'
          develocity-capture-file-fingerprints: 'false'
          develocity-enforce-url: 'false'
          develocity-plugin-version: '3.17'
          develocity-ccud-plugin-version: '2.0'
      - name: Assert setup ran with develocity inputs
        env:
          OUTCOME: ${{ steps.setup.outcome }}
          GRADLE_VERSION: ${{ steps.setup.outputs.gradle-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "gradle-version: $GRADLE_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$GRADLE_VERSION" ]; then
              echo "FAIL: action succeeded but gradle-version output is empty"
              exit 1
            fi
            echo "PASS: gradle-version=$GRADLE_VERSION"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or Develocity config issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
