name: Test Gradle plugin repository and deprecated arguments inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          gradle-version: '8.5'
          cache-disabled: true
          gradle-plugin-repository-url: 'https://plugins.gradle.org/m2'
          gradle-plugin-repository-username: 'test-user'
          gradle-plugin-repository-password: 'test-password'
          arguments: '--version'
          allow-snapshot-wrappers: false
          gradle-home-cache-strict-match: false
          add-job-summary: 'never'
          validate-wrappers: false
      - name: Assert setup completed
        env:
          GRADLE_VERSION: ${{ steps.setup.outputs.gradle-version }}
        run: |
          echo "gradle-version: $GRADLE_VERSION"
          if [ -z "$GRADLE_VERSION" ]; then
            echo "FAIL: expected gradle-version output to be set"
            exit 1
          fi
          echo "PASS: setup completed with plugin repository configuration"
