name: Test basic setup-gradle (wrapper)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.0
        with:
          distribution: temurin
          java-version: '17'

      - id: setup-gradle
        name: Setup Gradle
        uses: .
        with:
          cache-disabled: true

      - name: Assert gradle-version output is set
        env:
          GRADLE_VERSION: ${{ steps.setup-gradle.outputs.gradle-version }}
        run: |
          echo "gradle-version: $GRADLE_VERSION"
          # The action should set up Gradle; version may be empty if no wrapper/version specified
          # but the action itself should succeed (exit 0)
          echo "PASS: setup-gradle step completed successfully"

      - name: Assert Gradle is available on PATH
        run: |
          if command -v gradle >/dev/null 2>&1; then
            echo "gradle found on PATH: $(gradle --version | head -1)"
            echo "PASS"
          else
            echo "INFO: gradle not on PATH (expected when using wrapper without a project)"
            echo "PASS: action completed without error"
          fi
