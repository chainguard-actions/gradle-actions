name: Test deprecated arguments and build-root-directory inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create minimal Gradle project
        run: |
          mkdir -p /tmp/gradle-test-project
          cat > /tmp/gradle-test-project/build.gradle <<'EOF'
          task hello {
            doLast {
              println 'Hello from Gradle!'
            }
          }
          EOF
          cat > /tmp/gradle-test-project/settings.gradle <<'EOF'
          rootProject.name = 'test-project'
          EOF
      - id: action
        uses: .
        with:
          gradle-version: '8.5'
          build-root-directory: '/tmp/gradle-test-project'
          arguments: 'help'
          cache-disabled: true
      - name: Assert gradle-version output is set
        env:
          GRADLE_VERSION: ${{ steps.action.outputs.gradle-version }}
        run: |
          echo "gradle-version: $GRADLE_VERSION"
          if [ -z "$GRADLE_VERSION" ]; then
            echo "FAIL: expected gradle-version output to be set"
            exit 1
          fi
          echo "PASS: gradle-version is '$GRADLE_VERSION'"
