name: Test gradle-plugin-repository inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          gradle-plugin-repository-url: 'https://plugins.gradle.org/m2'
          gradle-plugin-repository-username: 'test-user'
          gradle-plugin-repository-password: 'test-password'
          cache-disabled: true
          validate-wrappers: false
      - name: Assert setup completed
        run: |
          echo "PASS: setup-gradle completed with gradle-plugin-repository inputs"
