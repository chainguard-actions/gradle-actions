name: Test basic usage with gradle-version and build-root-directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up minimal Gradle project
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-gradle-project"
          cp "$GITHUB_WORKSPACE/hardened/tests/fixtures/gradle-project/settings.gradle" \
             "$GITHUB_WORKSPACE/test-gradle-project/settings.gradle"
          cp "$GITHUB_WORKSPACE/hardened/tests/fixtures/gradle-project/build.gradle" \
             "$GITHUB_WORKSPACE/test-gradle-project/build.gradle"

      - id: action
        uses: .
        continue-on-error: true
        with:
          gradle-version: '8.5'
          build-root-directory: test-gradle-project
          dependency-resolution-task: dependencies
          additional-arguments: '--no-configuration-cache'
          dependency-graph: generate-and-upload
          dependency-graph-continue-on-failure: true
          cache-disabled: true

      - name: Assert action ran (outputs set or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          GRADLE_VERSION: ${{ steps.action.outputs.gradle-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "gradle-version output: $GRADLE_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
