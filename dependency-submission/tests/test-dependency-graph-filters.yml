name: Test dependency graph filter options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          gradle-version: '8.5'
          dependency-graph: 'generate-and-submit'
          dependency-graph-continue-on-failure: 'true'
          dependency-graph-exclude-projects: ':test.*'
          dependency-graph-include-projects: ':app.*'
          dependency-graph-exclude-configurations: 'testRuntime.*'
          dependency-graph-include-configurations: 'runtimeClasspath'
          artifact-retention-days: '5'
          cache-disabled: 'true'
      - name: Assert action ran (outputs set or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          DEP_GRAPH_FILE: ${{ steps.action.outputs.dependency-graph-file }}
        run: |
          echo "outcome: $OUTCOME"
          echo "dependency-graph-file: $DEP_GRAPH_FILE"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
