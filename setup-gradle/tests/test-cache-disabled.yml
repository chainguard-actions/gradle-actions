name: Test Gradle setup with caching disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: setup-gradle
        uses: .
        with:
          gradle-version: '8.6'
          cache-disabled: 'true'
        continue-on-error: true

      - name: Assert setup-gradle ran (output set or failed gracefully on network/env issues)
        env:
          GRADLE_VERSION: ${{ steps.setup-gradle.outputs.gradle-version }}
          OUTCOME: ${{ steps.setup-gradle.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "gradle-version output: $GRADLE_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$GRADLE_VERSION" ]; then
              echo "FAIL: action succeeded but gradle-version output is empty"
              exit 1
            fi
            echo "PASS: gradle-version is '$GRADLE_VERSION'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (network/env limitation in act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert gradle binary is on PATH (if action succeeded)
        env:
          OUTCOME: ${{ steps.setup-gradle.outcome }}
        run: |
          if [ "$OUTCOME" != "success" ]; then
            echo "INFO: Skipping PATH check since action did not succeed"
            exit 0
          fi
          echo "Checking gradle on PATH..."
          GRADLE_BIN=$(which gradle 2>/dev/null || true)
          if [ -z "$GRADLE_BIN" ]; then
            echo "FAIL: gradle not found on PATH after successful setup"
            exit 1
          fi
          echo "PASS: gradle found at $GRADLE_BIN"
