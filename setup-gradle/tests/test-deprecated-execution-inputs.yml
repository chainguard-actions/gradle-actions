name: Test deprecated execution inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create minimal Gradle wrapper project
        run: |
          mkdir -p "$GITHUB_WORKSPACE/gradle-test-project/gradle/wrapper"
          cat > "$GITHUB_WORKSPACE/gradle-test-project/build.gradle" <<'EOF'
          // minimal build file
          task hello {
            doLast {
              println 'Hello from Gradle!'
            }
          }
          EOF
          cat > "$GITHUB_WORKSPACE/gradle-test-project/settings.gradle" <<'EOF'
          rootProject.name = 'test-project'
          EOF
      - id: setup
        uses: .
        continue-on-error: true
        with:
          gradle-version: '8.7'
          cache-disabled: true
          add-job-summary: 'never'
          build-root-directory: './gradle-test-project'
          arguments: '--version'
      - name: Assert action ran (deprecated inputs accepted)
        env:
          OUTCOME: ${{ steps.setup.outcome }}
          GRADLE_VERSION: ${{ steps.setup.outputs.gradle-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "gradle-version: $GRADLE_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with deprecated inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (deprecated inputs may cause expected failure)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
