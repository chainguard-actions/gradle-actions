name: Test Gradle setup with 'current' version alias
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: setup-gradle
        uses: .
        continue-on-error: true
        with:
          gradle-version: 'current'
          cache-disabled: 'true'

      - name: Assert setup-gradle step ran with current version
        env:
          OUTCOME: ${{ steps.setup-gradle.outcome }}
          GRADLE_VERSION: ${{ steps.setup-gradle.outputs.gradle-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "gradle-version output: '$GRADLE_VERSION'"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$GRADLE_VERSION" ]; then
              echo "FAIL: action succeeded but gradle-version output is empty"
              exit 1
            fi
            if echo "$GRADLE_VERSION" | grep -qE '^[0-9]+\.[0-9]+'; then
              echo "PASS: gradle-version '$GRADLE_VERSION' looks like a valid version"
            else
              echo "FAIL: gradle-version '$GRADLE_VERSION' does not look like a valid version"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: setup-gradle ran and failed gracefully (dist may not be built)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
