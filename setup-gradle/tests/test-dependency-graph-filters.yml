name: Test dependency-graph filter inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          gradle-version: '8.5'
          cache-disabled: true
          validate-wrappers: false
          dependency-graph: 'disabled'
          dependency-graph-exclude-projects: '.*:test.*'
          dependency-graph-include-projects: '.*:main.*'
          dependency-graph-exclude-configurations: 'testRuntime.*'
          dependency-graph-include-configurations: 'runtimeClasspath'
          artifact-retention-days: '5'
      - name: Assert setup completed
        env:
          GRADLE_VERSION: ${{ steps.setup.outputs.gradle-version }}
        run: |
          echo "gradle-version: $GRADLE_VERSION"
          if [ -z "$GRADLE_VERSION" ]; then
            echo "FAIL: gradle-version output is empty"
            exit 1
          fi
          echo "PASS: setup completed with gradle-version '$GRADLE_VERSION'"
