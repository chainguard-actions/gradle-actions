name: Test cache encryption key input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          gradle-version: '8.7'
          cache-disabled: 'true'
          cache-encryption-key: 'dGVzdGtleWZvcmVuY3J5cHRpb24xMjM0NQ=='
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
          GRADLE_VERSION: ${{ steps.action.outputs.gradle-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "gradle-version: $GRADLE_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$GRADLE_VERSION" ]; then
              echo "FAIL: action succeeded but gradle-version output is empty"
              exit 1
            fi
            echo "PASS: gradle-version=$GRADLE_VERSION"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (may fail gracefully with encryption key)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
