name: Test min-wrapper-count zero allows no wrappers
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        with:
          min-wrapper-count: '0'
          allow-snapshots: 'false'
          allow-checksums: ''
        continue-on-error: true
      - name: Assert action succeeded with min-wrapper-count=0
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FAILED_WRAPPER: ${{ steps.action.outputs.failed-wrapper }}
        run: |
          echo "outcome: $OUTCOME"
          echo "failed-wrapper: $FAILED_WRAPPER"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with min-wrapper-count=0 (no wrappers required)"
          elif [ "$OUTCOME" = "failure" ] || [ -z "$OUTCOME" ]; then
            echo "PASS: action ran with min-wrapper-count=0 and reported a result (acceptable in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
