name: Test deprecated arguments and build-root-directory inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create minimal Gradle project
        run: |
          mkdir -p /tmp/gradle-project
          cat > /tmp/gradle-project/settings.gradle << 'EOF'
          rootProject.name = 'test-project'
          EOF
          cat > /tmp/gradle-project/build.gradle << 'EOF'
          // minimal build file
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          gradle-version: '8.7'
          cache-disabled: true
          build-root-directory: '/tmp/gradle-project'
          arguments: '--version'
          cache-encryption-key: 'dGVzdGtleXRlc3RrZXl0ZXN0a2V5dGVzdA=='
      - name: Assert action ran (deprecated arguments accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          GRADLE_VERSION: ${{ steps.action.outputs.gradle-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "gradle-version: $GRADLE_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$GRADLE_VERSION" ]; then
              echo "FAIL: action succeeded but gradle-version output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with gradle-version=$GRADLE_VERSION"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (deprecated inputs accepted, failure may be expected in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
