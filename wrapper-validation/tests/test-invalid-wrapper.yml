name: Test invalid gradle-wrapper.jar detection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Show fixture wrapper info
        run: |
          FIXTURE="$GITHUB_WORKSPACE/tests/fixtures/gradle/wrapper/gradle-wrapper.jar"
          if [ -f "$FIXTURE" ]; then
            echo "Fixture found: $FIXTURE"
            echo "Content: $(cat "$FIXTURE")"
            echo "SHA256: $(sha256sum "$FIXTURE")"
          else
            echo "WARNING: fixture gradle-wrapper.jar not found at $FIXTURE"
            echo "Action will find no wrappers and should fail due to min-wrapper-count=1"
          fi
      - id: action
        uses: .
        with:
          min-wrapper-count: '1'
        continue-on-error: true
      - name: Assert action failed due to invalid wrapper checksum
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FAILED: ${{ steps.action.outputs.failed-wrapper }}
        run: |
          echo "outcome: $OUTCOME"
          echo "failed-wrapper: '$FAILED'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for invalid wrapper, got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed for invalid wrapper (outcome=failure)"
