name: Test basic dependency submission
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create minimal Gradle project
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-project"
          cat > "$GITHUB_WORKSPACE/test-project/settings.gradle" << 'EOF'
          rootProject.name = 'test-project'
          EOF
          cat > "$GITHUB_WORKSPACE/test-project/build.gradle" << 'EOF'
          plugins {
              id 'java'
          }
          repositories {
              mavenCentral()
          }
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          build-root-directory: test-project
          dependency-graph: 'generate-and-submit'
          dependency-graph-continue-on-failure: 'true'
          cache-disabled: 'true'
          add-job-summary: 'always'
      - name: Assert action ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          DEP_GRAPH_FILE: ${{ steps.action.outputs.dependency-graph-file }}
        run: |
          echo "outcome: $OUTCOME"
          echo "dependency-graph-file: $DEP_GRAPH_FILE"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
