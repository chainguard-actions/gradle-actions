name: Test cache configuration inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up minimal Gradle project
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-gradle-project"
          cp "$GITHUB_WORKSPACE/hardened/tests/fixtures/gradle-project/settings.gradle" \
             "$GITHUB_WORKSPACE/test-gradle-project/settings.gradle"
          cp "$GITHUB_WORKSPACE/hardened/tests/fixtures/gradle-project/build.gradle" \
             "$GITHUB_WORKSPACE/test-gradle-project/build.gradle"

      - name: Generate a cache encryption key
        id: gen-key
        run: |
          KEY=$(openssl rand -base64 16)
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - id: action
        uses: .
        continue-on-error: true
        with:
          build-root-directory: test-gradle-project
          gradle-version: '8.5'
          cache-encryption-key: ${{ steps.gen-key.outputs.key }}
          gradle-home-cache-cleanup: never
          gradle-home-cache-excludes: |
            wrapper/dists/gradle-*-bin
          artifact-retention-days: 1
          dependency-graph: generate-and-upload
          dependency-graph-continue-on-failure: true
          cache-disabled: true

      - name: Assert action ran (outputs set or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
