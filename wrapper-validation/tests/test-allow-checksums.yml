name: Test allow-checksums input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create fake gradle-wrapper.jar files and compute checksums
        id: setup
        run: |
          mkdir -p gradle/wrapper
          mkdir -p subproject/gradle/wrapper
          # Create two fake JAR files with deterministic content
          printf 'fake-gradle-wrapper-content-for-allow-checksums-test-1' > gradle/wrapper/gradle-wrapper.jar
          printf 'fake-gradle-wrapper-content-for-allow-checksums-test-2' > subproject/gradle/wrapper/gradle-wrapper.jar
          CHECKSUM1=$(sha256sum gradle/wrapper/gradle-wrapper.jar | awk '{print $1}')
          CHECKSUM2=$(sha256sum subproject/gradle/wrapper/gradle-wrapper.jar | awk '{print $1}')
          echo "Wrapper 1 checksum: $CHECKSUM1"
          echo "Wrapper 2 checksum: $CHECKSUM2"

          # Also collect checksums of any pre-existing gradle-wrapper.jar files
          ALL_CHECKSUMS="$CHECKSUM1,$CHECKSUM2"
          while IFS= read -r -d '' f; do
            # Skip the files we just created
            if [ "$f" = "./gradle/wrapper/gradle-wrapper.jar" ] || \
               [ "$f" = "./subproject/gradle/wrapper/gradle-wrapper.jar" ]; then
              continue
            fi
            CS=$(sha256sum "$f" | awk '{print $1}')
            ALL_CHECKSUMS="$ALL_CHECKSUMS,$CS"
            echo "Found pre-existing wrapper: $f (checksum: $CS)"
          done < <(find . -name "gradle-wrapper.jar" -print0 2>/dev/null)

          echo "checksum1=$CHECKSUM1" >> "$GITHUB_OUTPUT"
          echo "checksum2=$CHECKSUM2" >> "$GITHUB_OUTPUT"
          echo "all-checksums=$ALL_CHECKSUMS" >> "$GITHUB_OUTPUT"
          echo "All checksums: $ALL_CHECKSUMS"
      - id: action
        uses: .
        with:
          min-wrapper-count: '2'
          allow-checksums: ${{ steps.setup.outputs.all-checksums }}
      - name: Assert no failed wrappers
        env:
          FAILED: ${{ steps.action.outputs.failed-wrapper }}
        run: |
          echo "failed-wrapper: '$FAILED'"
          if [ -n "$FAILED" ]; then
            echo "FAIL: expected no failed wrappers but got: $FAILED"
            exit 1
          fi
          echo "PASS: multiple custom checksums were accepted"
