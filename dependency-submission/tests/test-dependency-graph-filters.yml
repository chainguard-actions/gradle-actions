name: Test dependency graph filter inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          dependency-graph-exclude-projects: ':test.*'
          dependency-graph-include-projects: ':main.*'
          dependency-graph-exclude-configurations: 'testImplementation|testRuntimeOnly'
          dependency-graph-include-configurations: 'implementation|runtimeClasspath'
          dependency-graph: 'generate-and-submit'
          dependency-graph-continue-on-failure: 'true'
          cache-disabled: 'true'
      - name: Assert action ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
