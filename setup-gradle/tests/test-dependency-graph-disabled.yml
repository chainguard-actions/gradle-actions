name: Test setup-gradle with dependency-graph disabled (default)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: setup-gradle
        uses: .
        continue-on-error: true
        with:
          gradle-version: '8.5'
          cache-disabled: 'true'
          dependency-graph: 'disabled'
          validate-wrappers: 'false'

      - name: Assert action ran with dependency-graph disabled
        env:
          GRADLE_VERSION: ${{ steps.setup-gradle.outputs.gradle-version }}
          DEP_GRAPH_FILE: ${{ steps.setup-gradle.outputs.dependency-graph-file }}
          OUTCOME: ${{ steps.setup-gradle.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "gradle-version: '$GRADLE_VERSION'"
          echo "dependency-graph-file: '$DEP_GRAPH_FILE'"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$GRADLE_VERSION" ]; then
              echo "FAIL: action succeeded but gradle-version output is empty"
              exit 1
            fi
            echo "PASS: gradle-version='$GRADLE_VERSION'"
            if [ -n "$DEP_GRAPH_FILE" ]; then
              echo "INFO: dependency-graph-file is set to '$DEP_GRAPH_FILE' (may be set by action internals)"
            else
              echo "PASS: dependency-graph-file is empty as expected when disabled"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (dist files or network not available in act environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert gradle is on PATH (if action succeeded)
        env:
          OUTCOME: ${{ steps.setup-gradle.outcome }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            if ! command -v gradle >/dev/null 2>&1; then
              echo "FAIL: gradle not found on PATH"
              exit 1
            fi
            echo "PASS: gradle is available at $(command -v gradle)"
          else
            echo "INFO: skipping PATH check since action did not succeed"
            echo "PASS"
          fi
