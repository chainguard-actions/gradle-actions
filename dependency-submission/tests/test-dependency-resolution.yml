name: Test dependency resolution task and artifact retention
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          gradle-version: '8.10'
          build-root-directory: tests/fixtures/gradle-project
          dependency-graph: generate-and-upload
          cache-disabled: true
          dependency-graph-continue-on-failure: true
          dependency-resolution-task: 'dependencies'
          artifact-retention-days: '7'

      - name: Assert action ran with dependency resolution task and artifact retention
        env:
          OUTCOME: ${{ steps.action.outcome }}
          GRADLE_VERSION: ${{ steps.action.outputs.gradle-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "gradle-version: $GRADLE_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with dependency resolution task and artifact retention"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo or missing Gradle project)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
