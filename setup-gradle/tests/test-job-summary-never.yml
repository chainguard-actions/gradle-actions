name: Test setup-gradle with add-job-summary never
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure Java is available
        run: |
          java -version 2>&1 || (sudo apt-get update -q && sudo apt-get install -y -q default-jdk)
          java -version

      - id: setup
        uses: .
        with:
          gradle-version: '8.5'
          cache-disabled: 'true'
          add-job-summary: 'never'

      - name: Assert gradle-version output is set
        env:
          GRADLE_VERSION: ${{ steps.setup.outputs.gradle-version }}
        run: |
          echo "gradle-version: $GRADLE_VERSION"
          if [ -z "$GRADLE_VERSION" ]; then
            echo "FAIL: gradle-version output is empty"
            exit 1
          fi
          echo "PASS: gradle-version=$GRADLE_VERSION"

      - name: Run a simple gradle task
        run: |
          gradle --version
          echo "PASS: gradle --version succeeded with add-job-summary=never"
