name: Test allow-checksums with custom checksum
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify committed fixture wrapper exists and confirm its checksum
        run: |
          if [ ! -f "tests/fixtures/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "FAIL: fixture gradle-wrapper.jar not found"
            exit 1
          fi
          ACTUAL_CHECKSUM=$(sha256sum tests/fixtures/gradle/wrapper/gradle-wrapper.jar | awk '{print $1}')
          echo "Fixture gradle-wrapper.jar checksum: $ACTUAL_CHECKSUM"
          EXPECTED="e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
          if [ "$ACTUAL_CHECKSUM" != "$EXPECTED" ]; then
            echo "FAIL: unexpected checksum for fixture file: $ACTUAL_CHECKSUM"
            exit 1
          fi
          echo "Checksum confirmed: $ACTUAL_CHECKSUM"
      - id: action
        uses: .
        with:
          min-wrapper-count: '1'
          # SHA256 of an empty file - matches the committed empty gradle-wrapper.jar fixtures
          allow-checksums: 'e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855'
      - name: Assert no failed-wrapper output
        env:
          FAILED: ${{ steps.action.outputs.failed-wrapper }}
        run: |
          echo "failed-wrapper: '$FAILED'"
          if [ -n "$FAILED" ]; then
            echo "FAIL: expected no failed-wrapper output but got: $FAILED"
            exit 1
          fi
          echo "PASS: custom checksum was accepted"
