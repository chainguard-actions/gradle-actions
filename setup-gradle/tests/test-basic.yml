name: Test basic setup-gradle (wrapper)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-gradle
        uses: .
        with:
          cache-disabled: 'true'
          cache-provider: 'basic'
          validate-wrappers: 'false'
          add-job-summary: 'never'
          dependency-graph: 'disabled'
        continue-on-error: true
      - name: Assert action ran (setup-gradle may fail without a wrapper, but should not crash)
        env:
          OUTCOME: ${{ steps.setup-gradle.outcome }}
          GRADLE_VERSION: ${{ steps.setup-gradle.outputs.gradle-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "gradle-version: $GRADLE_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no wrapper present in test repo, or harness limitation)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
