name: Test failing dependency resolution task
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure a JDK is available
        run: |
          if command -v java >/dev/null 2>&1; then
            java -version
            exit 0
          fi
          case "$(uname -m)" in
            x86_64|amd64) ARCH=x64 ;;
            aarch64|arm64) ARCH=aarch64 ;;
            *) echo "unsupported arch $(uname -m)"; exit 1 ;;
          esac
          mkdir -p /tmp/jdk
          curl -sSfL "https://api.adoptium.net/v3/binary/latest/17/ga/linux/${ARCH}/jdk/hotspot/normal/eclipse" -o /tmp/jdk.tar.gz
          tar -xzf /tmp/jdk.tar.gz -C /tmp/jdk --strip-components=1
          echo "JAVA_HOME=/tmp/jdk" >> "$GITHUB_ENV"
          echo "/tmp/jdk/bin" >> "$GITHUB_PATH"
          /tmp/jdk/bin/java -version
      - id: action
        uses: .
        continue-on-error: true
        with:
          gradle-version: '8.10.2'
          build-root-directory: tests/fixtures/gradle-project
          dependency-graph: generate-and-submit
          dependency-resolution-task: thisTaskDoesNotExist
          dependency-graph-report-dir: dg-reports-failing
          cache-disabled: 'true'
          add-job-summary: never
      - name: Assert action failed for nonexistent task
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when the resolution task does not exist"
            exit 1
          fi
          echo "PASS"
