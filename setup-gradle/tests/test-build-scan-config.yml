name: Test build scan configuration inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          gradle-version: '8.7'
          cache-disabled: true
          build-scan-publish: false
          build-scan-terms-of-use-url: 'https://gradle.com/terms-of-service'
          build-scan-terms-of-use-agree: 'yes'
          build-scan-terms-of-service-url: 'https://gradle.com/terms-of-service'
          build-scan-terms-of-service-agree: 'yes'
          artifact-retention-days: '7'
      - name: Assert gradle-version output is set
        env:
          GRADLE_VERSION: ${{ steps.action.outputs.gradle-version }}
        run: |
          echo "gradle-version: $GRADLE_VERSION"
          if [ -z "$GRADLE_VERSION" ]; then
            echo "FAIL: gradle-version output is empty"
            exit 1
          fi
          echo "PASS: gradle-version=$GRADLE_VERSION"
