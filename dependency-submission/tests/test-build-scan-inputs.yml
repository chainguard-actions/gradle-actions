name: Test build-scan and cache-encryption-key inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up minimal Gradle project
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-gradle-project"
          cp -r "$GITHUB_WORKSPACE/tests/fixtures/gradle-project/." "$GITHUB_WORKSPACE/test-gradle-project/"

      - id: action
        uses: .
        continue-on-error: true
        with:
          gradle-version: '8.5'
          build-root-directory: test-gradle-project
          build-scan-publish: false
          build-scan-terms-of-use-url: 'https://gradle.com/terms-of-service'
          build-scan-terms-of-use-agree: 'yes'
          build-scan-terms-of-service-url: 'https://gradle.com/terms-of-service'
          build-scan-terms-of-service-agree: 'yes'
          cache-encryption-key: 'dGVzdGtleXRlc3RrZXl0ZXN0a2V5dGVzdA=='
          dependency-graph: generate-and-submit
          dependency-graph-continue-on-failure: true
          cache-disabled: true

      - name: Assert action ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          GRADLE_VERSION: ${{ steps.action.outputs.gradle-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "gradle-version: $GRADLE_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$GRADLE_VERSION" ]; then
              echo "FAIL: action succeeded but gradle-version output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with gradle-version='$GRADLE_VERSION'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
