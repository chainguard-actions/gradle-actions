name: Test min-wrapper-count not met fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a custom jar and compute allowed checksums
        id: setup
        run: |
          rm -rf "$GITHUB_WORKSPACE"/acttest-*
          mkdir -p "$GITHUB_WORKSPACE/acttest-count/gradle/wrapper"
          echo "count test wrapper content" > "$GITHUB_WORKSPACE/acttest-count/gradle/wrapper/gradle-wrapper.jar"
          cd "$GITHUB_WORKSPACE"
          SUMS=$(find . -name gradle-wrapper.jar -type f -not -path './.git/*' -exec sha256sum {} \; | awk '{print $1}' | sort -u | paste -sd, -)
          echo "sums=$SUMS" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        continue-on-error: true
        with:
          min-wrapper-count: '9999'
          allow-checksums: ${{ steps.setup.outputs.sums }}
      - name: Assert action failed due to too few wrappers
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FAILED: ${{ steps.action.outputs.failed-wrapper }}
        run: |
          echo "outcome: $OUTCOME"
          echo "failed-wrapper: '$FAILED'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when min-wrapper-count is not met"
            exit 1
          fi
          if [ -n "$FAILED" ]; then
            echo "FAIL: no wrapper should be reported invalid (all checksums allowed)"
            exit 1
          fi
          echo "PASS"
      - name: Cleanup
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE"/acttest-*
