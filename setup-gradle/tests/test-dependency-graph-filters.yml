name: Test dependency-graph filter inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          dependency-graph: disabled
          dependency-graph-exclude-projects: ':test.*'
          dependency-graph-include-projects: ':app.*'
          dependency-graph-exclude-configurations: 'testRuntime.*'
          dependency-graph-include-configurations: 'runtimeClasspath'
          artifact-retention-days: 5
          cache-disabled: true
          validate-wrappers: false
      - name: Assert setup completed
        run: |
          echo "PASS: setup-gradle completed with dependency-graph filter inputs and artifact-retention-days"
