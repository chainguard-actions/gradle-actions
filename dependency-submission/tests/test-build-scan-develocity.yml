name: Test build scan and develocity inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up minimal Gradle project
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-gradle-project"
          cp "$GITHUB_WORKSPACE/hardened/tests/fixtures/gradle-project/settings.gradle" \
             "$GITHUB_WORKSPACE/test-gradle-project/settings.gradle"
          cp "$GITHUB_WORKSPACE/hardened/tests/fixtures/gradle-project/build.gradle" \
             "$GITHUB_WORKSPACE/test-gradle-project/build.gradle"

      - id: action
        uses: .
        continue-on-error: true
        with:
          build-root-directory: test-gradle-project
          gradle-version: '8.5'
          build-scan-publish: false
          build-scan-terms-of-use-url: 'https://gradle.com/terms-of-service'
          build-scan-terms-of-use-agree: 'yes'
          develocity-access-key: 'fake-access-key-for-testing'
          develocity-token-expiry: '2'
          dependency-graph: generate-and-upload
          dependency-graph-continue-on-failure: true
          cache-disabled: true

      - name: Assert action ran (outputs set or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
