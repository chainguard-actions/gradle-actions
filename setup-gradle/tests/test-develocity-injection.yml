name: Test develocity injection configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install a JDK (setup-gradle requires java on PATH)
        run: |
          set -e
          if command -v java >/dev/null 2>&1; then
            echo "java already present"; java -version; exit 0
          fi
          case "$(uname -m)" in
            x86_64|amd64) ARCH=x64 ;;
            aarch64|arm64) ARCH=aarch64 ;;
            *) echo "unsupported arch $(uname -m)"; exit 1 ;;
          esac
          DEST="$RUNNER_TEMP/jdk17"
          mkdir -p "$DEST"
          curl -fsSL -o "$RUNNER_TEMP/jdk.tar.gz" \
            "https://api.adoptium.net/v3/binary/latest/17/ga/linux/${ARCH}/jdk/hotspot/normal/eclipse"
          tar -xzf "$RUNNER_TEMP/jdk.tar.gz" -C "$DEST" --strip-components=1
          "$DEST/bin/java" -version
          echo "JAVA_HOME=$DEST" >> "$GITHUB_ENV"
          echo "$DEST/bin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          gradle-version: '8.5'
          cache-disabled: 'true'
          validate-wrappers: 'false'
          add-job-summary: never
          develocity-injection-enabled: 'true'
          develocity-url: 'https://develocity.example.com'
          develocity-allow-untrusted-server: 'true'
          develocity-capture-file-fingerprints: 'true'
          develocity-enforce-url: 'true'
          develocity-plugin-version: '3.18.1'
          develocity-ccud-plugin-version: '2.0.2'
          gradle-plugin-repository-url: 'https://plugins.example.com/m2'
          gradle-plugin-repository-username: 'test-user'
          gradle-plugin-repository-password: 'test-password'
      - name: Assert gradle-version output
        env:
          ACTUAL: ${{ steps.action.outputs.gradle-version }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "8.5" ]; then
            echo "FAIL: expected '8.5'"
            exit 1
          fi
          echo "PASS"
      - name: Assert develocity env vars exported
        run: |
          echo "DEVELOCITY_INJECTION_ENABLED=$DEVELOCITY_INJECTION_ENABLED"
          echo "DEVELOCITY_URL=$DEVELOCITY_URL"
          echo "DEVELOCITY_PLUGIN_VERSION=$DEVELOCITY_PLUGIN_VERSION"
          FAILED=0
          [ "$DEVELOCITY_INJECTION_ENABLED" = "true" ] || { echo "FAIL: injection not enabled"; FAILED=1; }
          [ "$DEVELOCITY_URL" = "https://develocity.example.com" ] || { echo "FAIL: url"; FAILED=1; }
          [ "$DEVELOCITY_PLUGIN_VERSION" = "3.18.1" ] || { echo "FAIL: plugin version"; FAILED=1; }
          if [ "$FAILED" -ne 0 ]; then exit 1; fi
          echo "PASS"
