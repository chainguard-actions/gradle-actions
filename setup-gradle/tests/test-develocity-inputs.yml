name: Test develocity inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          gradle-version: '8.10'
          cache-disabled: true
          develocity-access-key: ''
          develocity-token-expiry: '2'
          develocity-injection-enabled: false
          develocity-url: 'https://develocity.example.com'
          develocity-allow-untrusted-server: false
          develocity-capture-file-fingerprints: false
          develocity-enforce-url: false
          develocity-plugin-version: '3.17'
          develocity-ccud-plugin-version: '2.0'
      - name: Assert gradle-version output is set
        env:
          GRADLE_VERSION: ${{ steps.action.outputs.gradle-version }}
        run: |
          echo "gradle-version: $GRADLE_VERSION"
          if [ -z "$GRADLE_VERSION" ]; then
            echo "FAIL: expected gradle-version output to be set"
            exit 1
          fi
          echo "PASS"
