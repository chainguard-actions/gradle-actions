name: Test setup-gradle with specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-gradle
        uses: .
        with:
          gradle-version: '8.5'
          cache-disabled: 'true'
          cache-provider: 'basic'
          validate-wrappers: 'false'
          add-job-summary: 'never'
          dependency-graph: 'disabled'
        continue-on-error: true
      - name: Assert gradle-version output or graceful failure
        env:
          OUTCOME: ${{ steps.setup-gradle.outcome }}
          GRADLE_VERSION: ${{ steps.setup-gradle.outputs.gradle-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "gradle-version: $GRADLE_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$GRADLE_VERSION" ]; then
              echo "FAIL: action succeeded but gradle-version output is empty"
              exit 1
            fi
            echo "PASS: gradle-version is '$GRADLE_VERSION'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (harness limitation with sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
      - name: Assert gradle is on PATH (if action succeeded)
        env:
          OUTCOME: ${{ steps.setup-gradle.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            GRADLE_BIN=$(which gradle 2>/dev/null)
            if [ -z "$GRADLE_BIN" ]; then
              echo "FAIL: gradle not found on PATH after successful setup"
              exit 1
            fi
            echo "gradle binary found at: $GRADLE_BIN"
            if [ ! -x "$GRADLE_BIN" ]; then
              echo "FAIL: gradle binary is not executable"
              exit 1
            fi
            echo "PASS: gradle $GRADLE_BIN is available"
          else
            echo "SKIP: action did not succeed, skipping PATH check"
          fi
