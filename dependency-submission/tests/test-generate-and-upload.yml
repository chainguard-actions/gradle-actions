name: Test generate-and-upload dependency graph
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up minimal Gradle project
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-gradle-project"
          cp "$GITHUB_WORKSPACE/tests/fixtures/gradle-project/settings.gradle" \
             "$GITHUB_WORKSPACE/test-gradle-project/settings.gradle"
          cp "$GITHUB_WORKSPACE/tests/fixtures/gradle-project/build.gradle" \
             "$GITHUB_WORKSPACE/test-gradle-project/build.gradle"

      - id: action
        uses: .
        continue-on-error: true
        with:
          gradle-version: '8.7'
          build-root-directory: test-gradle-project
          dependency-graph: generate-and-upload
          dependency-graph-continue-on-failure: true
          cache-disabled: true
          add-job-summary: never

      - name: Assert action ran (generate-and-upload mode)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          GRADLE_VERSION: ${{ steps.action.outputs.gradle-version }}
          DEP_GRAPH_FILE: ${{ steps.action.outputs.dependency-graph-file }}
        run: |
          echo "outcome: $OUTCOME"
          echo "gradle-version output: $GRADLE_VERSION"
          echo "dependency-graph-file output: $DEP_GRAPH_FILE"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$GRADLE_VERSION" ]; then
              echo "FAIL: action succeeded but gradle-version output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with gradle-version='$GRADLE_VERSION'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
