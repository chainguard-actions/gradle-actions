name: Test setup-gradle with validate-wrappers
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: setup
        uses: .
        continue-on-error: true
        with:
          gradle-version: '8.5'
          cache-disabled: 'true'
          validate-wrappers: 'false'

      - name: Assert setup-gradle ran (outputs set, or failed gracefully if dist not accessible)
        env:
          GRADLE_VERSION: ${{ steps.setup.outputs.gradle-version }}
          OUTCOME: ${{ steps.setup.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "gradle-version: $GRADLE_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$GRADLE_VERSION" ]; then
              echo "FAIL: action succeeded but gradle-version output is empty"
              exit 1
            fi
            if ! echo "$GRADLE_VERSION" | grep -q "8.5"; then
              echo "FAIL: expected gradle-version to contain '8.5' but got '$GRADLE_VERSION'"
              exit 1
            fi
            echo "PASS: gradle-version=$GRADLE_VERSION with validate-wrappers=false"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (dist files may not be accessible in container)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
