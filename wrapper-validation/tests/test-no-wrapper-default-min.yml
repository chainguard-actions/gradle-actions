name: Test default min-wrapper-count=1 with valid wrapper succeeds
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify committed fixture wrapper exists
        run: |
          if [ ! -f "tests/fixtures/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "FAIL: fixture gradle-wrapper.jar not found"
            exit 1
          fi
          echo "Fixture gradle-wrapper.jar found"
          sha256sum tests/fixtures/gradle/wrapper/gradle-wrapper.jar
      - id: action
        uses: .
        with:
          # Default min-wrapper-count is 1; we have committed fixtures so this should be satisfied
          allow-checksums: 'e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855'
      - name: Assert action succeeded with default min-wrapper-count and valid wrapper
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FAILED: ${{ steps.action.outputs.failed-wrapper }}
        run: |
          echo "outcome: $OUTCOME"
          echo "failed-wrapper: '$FAILED'"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed with default min-wrapper-count=1 and valid wrapper, but got: $OUTCOME"
            exit 1
          fi
          if [ -n "$FAILED" ]; then
            echo "FAIL: expected no failed-wrapper output but got: $FAILED"
            exit 1
          fi
          echo "PASS: action succeeded with default min-wrapper-count=1 and valid wrapper present"
