name: Test setup-gradle with custom cache includes/excludes
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.0
        with:
          distribution: temurin
          java-version: '17'

      - id: setup-gradle
        name: Setup Gradle with custom cache includes/excludes
        uses: .
        with:
          gradle-version: '8.5'
          cache-read-only: true
          gradle-home-cache-includes: |
            caches
            notifications
          gradle-home-cache-excludes: |
            caches/build-cache-*

      - name: Assert action succeeded with custom cache configuration
        env:
          GRADLE_VERSION: ${{ steps.setup-gradle.outputs.gradle-version }}
        run: |
          echo "gradle-version: $GRADLE_VERSION"
          if [ -z "$GRADLE_VERSION" ]; then
            echo "FAIL: gradle-version output is empty"
            exit 1
          fi
          echo "PASS: setup-gradle with custom cache includes/excludes completed"

      - name: Verify Gradle is functional
        run: |
          gradle --version
          echo "PASS: Gradle is functional"
