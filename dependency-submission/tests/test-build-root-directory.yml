name: Test build-root-directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal Gradle project in a subdirectory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/my-subproject"
          cat > "$GITHUB_WORKSPACE/my-subproject/settings.gradle" <<'EOF'
          rootProject.name = 'test-project'
          EOF
          cat > "$GITHUB_WORKSPACE/my-subproject/build.gradle" <<'EOF'
          plugins {
              id 'java'
          }
          repositories {
              mavenCentral()
          }
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          build-root-directory: my-subproject
          cache-disabled: 'true'
          dependency-graph-continue-on-failure: 'true'
      - name: Assert action ran (build-root-directory input accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or no Gradle wrapper)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
