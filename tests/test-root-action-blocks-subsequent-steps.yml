name: Test root action failure blocks subsequent steps
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
      - id: guarded
        name: Step that should only run if action succeeded
        if: steps.action.outcome == 'success'
        run: echo "ran"
      - name: Assert guarded step was skipped
        env:
          OUTCOME: ${{ steps.action.outcome }}
          GUARDED: ${{ steps.guarded.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          echo "guarded outcome: $GUARDED"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action failure, got '$OUTCOME'"
            exit 1
          fi
          if [ "$GUARDED" != "skipped" ]; then
            echo "FAIL: expected guarded step to be skipped, got '$GUARDED'"
            exit 1
          fi
          echo "PASS"
