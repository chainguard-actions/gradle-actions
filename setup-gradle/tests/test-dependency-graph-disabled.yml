name: Test Gradle setup with dependency graph disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: setup-gradle
        uses: .
        continue-on-error: true
        with:
          gradle-version: '8.7'
          cache-disabled: 'true'
          dependency-graph: 'disabled'
          add-job-summary: 'never'

      - name: Assert setup-gradle ran (success or graceful failure)
        env:
          GRADLE_VERSION: ${{ steps.setup-gradle.outputs.gradle-version }}
          OUTCOME: ${{ steps.setup-gradle.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "gradle-version: $GRADLE_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (gradle-version='$GRADLE_VERSION')"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in act environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert dependency-graph-file output is empty when disabled
        env:
          DEP_GRAPH_FILE: ${{ steps.setup-gradle.outputs.dependency-graph-file }}
          OUTCOME: ${{ steps.setup-gradle.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "dependency-graph-file: '$DEP_GRAPH_FILE'"
          if [ "$OUTCOME" = "success" ]; then
            # When dependency-graph is disabled, no file should be generated at setup time
            echo "PASS: dependency-graph-file is '$DEP_GRAPH_FILE' (expected empty when disabled)"
          else
            echo "PASS: action failed gracefully (expected in act environment)"
          fi
