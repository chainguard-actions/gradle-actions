name: Test basic dependency submission
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          gradle-version: '8.10'
          build-root-directory: tests/fixtures/gradle-project
          dependency-graph: generate-and-upload
          cache-disabled: true
          dependency-graph-continue-on-failure: true

      - name: Assert action ran (succeeded or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          GRADLE_VERSION: ${{ steps.action.outputs.gradle-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "gradle-version output: $GRADLE_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
            if [ -n "$GRADLE_VERSION" ]; then
              echo "PASS: gradle-version output is set to '$GRADLE_VERSION'"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo or missing Gradle project)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
