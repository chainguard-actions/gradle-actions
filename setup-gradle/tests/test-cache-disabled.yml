name: Test setup-gradle with cache disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.0
        with:
          distribution: temurin
          java-version: '17'

      - id: setup-gradle
        name: Setup Gradle with caching disabled
        uses: .
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Assert action succeeded and Gradle is available
        env:
          GRADLE_VERSION: ${{ steps.setup-gradle.outputs.gradle-version }}
        run: |
          echo "gradle-version: $GRADLE_VERSION"
          if [ -z "$GRADLE_VERSION" ]; then
            echo "FAIL: gradle-version output is empty"
            exit 1
          fi
          echo "PASS: action completed with cache-disabled=true"

      - name: Run a simple Gradle task to verify setup
        run: |
          gradle --version
          echo "PASS: Gradle executed successfully"
