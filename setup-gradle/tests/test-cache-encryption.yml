name: Test cache-encryption-key and cache-excludes inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          gradle-version: '8.5'
          cache-encryption-key: 'dGVzdGtleWZvcmVuY3J5cHRpb24xMjM0NQ=='
          gradle-home-cache-excludes: |
            caches/modules-2/files-2.1/com.example
          cache-disabled: false
          cache-read-only: true
          validate-wrappers: false
      - name: Assert setup completed
        env:
          GRADLE_VERSION: ${{ steps.setup.outputs.gradle-version }}
        run: |
          echo "gradle-version: $GRADLE_VERSION"
          if [ -z "$GRADLE_VERSION" ]; then
            echo "FAIL: gradle-version output is empty"
            exit 1
          fi
          echo "PASS: setup completed with cache-encryption-key and gradle-home-cache-excludes"
