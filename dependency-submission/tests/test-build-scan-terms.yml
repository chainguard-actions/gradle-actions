name: Test build-scan terms inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal Gradle project
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-project"
          cat > "$GITHUB_WORKSPACE/test-project/settings.gradle" << 'EOF'
          rootProject.name = 'test-project'
          EOF
          cat > "$GITHUB_WORKSPACE/test-project/build.gradle" << 'EOF'
          plugins {
              id 'java'
          }
          repositories {
              mavenCentral()
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          build-root-directory: test-project
          build-scan-terms-of-use-url: 'https://gradle.com/terms-of-service'
          build-scan-terms-of-use-agree: 'yes'
          build-scan-terms-of-service-url: 'https://gradle.com/terms-of-service'
          build-scan-terms-of-service-agree: 'yes'
          dependency-graph-continue-on-failure: true
          cache-disabled: true

      - name: Assert action ran (succeeded or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
