name: Test generate-and-upload dependency graph
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          gradle-version: '8.10'
          build-root-directory: tests/fixtures/gradle-project
          dependency-graph: generate-and-upload
          cache-disabled: true
          add-job-summary: 'never'
          dependency-graph-continue-on-failure: true

      - name: Assert action ran with generate-and-upload mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
          GRADLE_VERSION: ${{ steps.action.outputs.gradle-version }}
          DEP_GRAPH_FILE: ${{ steps.action.outputs.dependency-graph-file }}
        run: |
          echo "outcome: $OUTCOME"
          echo "gradle-version: $GRADLE_VERSION"
          echo "dependency-graph-file: $DEP_GRAPH_FILE"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded in generate-and-upload mode"
            if [ -n "$GRADLE_VERSION" ]; then
              echo "PASS: gradle-version is '$GRADLE_VERSION'"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (acceptable with sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
