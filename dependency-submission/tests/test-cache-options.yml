name: Test cache-encryption-key and gradle-home-cache-excludes inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Generate a cache encryption key
        id: gen-key
        run: |
          KEY=$(openssl rand -base64 16)
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        continue-on-error: true
        with:
          cache-encryption-key: ${{ steps.gen-key.outputs.key }}
          gradle-home-cache-excludes: |
            caches/build-cache-*
            caches/keyrings
          dependency-graph-continue-on-failure: 'true'
      - name: Assert action ran (cache-encryption-key and gradle-home-cache-excludes inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or no Gradle wrapper)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
