name: Test Gradle setup with job summary configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Test with add-job-summary never (safe for act environment)
        id: setup-never
        uses: .
        continue-on-error: true
        with:
          gradle-version: '8.5'
          cache-disabled: 'true'
          add-job-summary: 'never'
          dependency-graph: 'disabled'

      - name: Assert setup with never job summary succeeded
        env:
          GRADLE_VERSION: ${{ steps.setup-never.outputs.gradle-version }}
          OUTCOME: ${{ steps.setup-never.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "gradle-version: $GRADLE_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$GRADLE_VERSION" ]; then
              echo "FAIL: action succeeded but gradle-version output is empty"
              exit 1
            fi
            echo "PASS: setup with add-job-summary=never succeeded, gradle-version=$GRADLE_VERSION"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in restricted environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert Gradle binary is available (if action succeeded)
        env:
          OUTCOME: ${{ steps.setup-never.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            if ! command -v gradle > /dev/null 2>&1; then
              echo "FAIL: gradle not found on PATH after successful setup"
              exit 1
            fi
            echo "PASS: gradle is available on PATH"
          else
            echo "SKIP: action did not succeed, skipping PATH check"
          fi
