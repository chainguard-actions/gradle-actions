name: Test dependency graph configuration inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          gradle-version: '8.5'
          cache-disabled: true
          dependency-graph: 'disabled'
          dependency-graph-report-dir: 'dependency-graph-reports'
          dependency-graph-continue-on-failure: true
          dependency-graph-exclude-projects: ':test.*'
          dependency-graph-include-projects: ':app.*'
          dependency-graph-exclude-configurations: 'testRuntime.*'
          dependency-graph-include-configurations: 'runtimeClasspath'
          artifact-retention-days: '5'
          add-job-summary: 'never'
          validate-wrappers: false
      - name: Assert setup completed
        env:
          GRADLE_VERSION: ${{ steps.setup.outputs.gradle-version }}
        run: |
          echo "gradle-version: $GRADLE_VERSION"
          if [ -z "$GRADLE_VERSION" ]; then
            echo "FAIL: expected gradle-version output to be set"
            exit 1
          fi
          echo "PASS: setup completed with dependency graph configuration"
