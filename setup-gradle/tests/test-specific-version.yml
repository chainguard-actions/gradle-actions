name: Test setup-gradle with specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: setup-gradle
        uses: .
        continue-on-error: true
        with:
          gradle-version: '8.5'
          cache-disabled: 'true'
          validate-wrappers: 'false'

      - name: Assert gradle-version output is set (if action succeeded)
        env:
          GRADLE_VERSION: ${{ steps.setup-gradle.outputs.gradle-version }}
          OUTCOME: ${{ steps.setup-gradle.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "gradle-version output: '$GRADLE_VERSION'"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$GRADLE_VERSION" ]; then
              echo "FAIL: action succeeded but gradle-version output is empty"
              exit 1
            fi
            echo "PASS: gradle-version is '$GRADLE_VERSION'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (dist files or network not available in act environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert gradle version matches requested (if action succeeded)
        env:
          GRADLE_VERSION: ${{ steps.setup-gradle.outputs.gradle-version }}
          OUTCOME: ${{ steps.setup-gradle.outcome }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            echo "Checking gradle on PATH..."
            if ! command -v gradle >/dev/null 2>&1; then
              echo "FAIL: gradle not found on PATH after setup"
              exit 1
            fi
            echo "PASS: gradle found at $(command -v gradle)"
            if command -v java >/dev/null 2>&1; then
              ACTUAL_VERSION=$(gradle --version 2>/dev/null | grep '^Gradle ' | awk '{print $2}')
              echo "Actual gradle version: '$ACTUAL_VERSION'"
              echo "Expected gradle version: '$GRADLE_VERSION'"
              if [ -z "$ACTUAL_VERSION" ]; then
                echo "FAIL: could not determine gradle version from 'gradle --version'"
                exit 1
              fi
              if [ "$ACTUAL_VERSION" != "$GRADLE_VERSION" ]; then
                echo "FAIL: expected gradle version '$GRADLE_VERSION' but got '$ACTUAL_VERSION'"
                exit 1
              fi
              echo "PASS: gradle $ACTUAL_VERSION is available and matches expected version"
            else
              echo "INFO: Java not available, skipping gradle --version check"
              echo "PASS: gradle is on PATH (version check skipped)"
            fi
          else
            echo "INFO: skipping version check since action did not succeed"
            echo "PASS"
          fi
