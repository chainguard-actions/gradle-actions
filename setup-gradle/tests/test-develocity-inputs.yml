name: Test develocity inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          gradle-version: '8.7'
          cache-disabled: true
          add-job-summary: 'never'
          develocity-injection-enabled: 'false'
          develocity-url: ''
          develocity-allow-untrusted-server: 'false'
          develocity-access-key: ''
          develocity-token-expiry: '2'
          develocity-capture-file-fingerprints: 'false'
          develocity-enforce-url: 'false'
          develocity-plugin-version: ''
          develocity-ccud-plugin-version: ''
      - name: Assert gradle-version output is set
        env:
          GRADLE_VERSION: ${{ steps.setup.outputs.gradle-version }}
        run: |
          echo "gradle-version: $GRADLE_VERSION"
          if [ -z "$GRADLE_VERSION" ]; then
            echo "FAIL: gradle-version output is empty"
            exit 1
          fi
          echo "PASS: gradle-version=$GRADLE_VERSION"
