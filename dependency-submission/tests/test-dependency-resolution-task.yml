name: Test dependency-resolution-task and cache-encryption-key inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal Gradle wrapper project
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-project"
          cd "$GITHUB_WORKSPACE/test-project"
          cat > settings.gradle << 'EOF'
          rootProject.name = 'test-project'
          EOF
          cat > build.gradle << 'EOF'
          plugins {
              id 'java'
          }
          repositories {
              mavenCentral()
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          gradle-version: '8.5'
          build-root-directory: test-project
          dependency-resolution-task: ':dependencies'
          cache-encryption-key: 'dGVzdGtleXRlc3RrZXl0ZXN0a2V5dGVzdA=='
          dependency-graph-continue-on-failure: 'true'
          cache-disabled: 'true'

      - name: Assert action ran with dependency-resolution-task input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
