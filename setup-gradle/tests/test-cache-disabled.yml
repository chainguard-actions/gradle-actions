name: Test setup-gradle with cache disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: setup
        uses: .
        continue-on-error: true
        with:
          gradle-version: '8.5'
          cache-disabled: 'true'
          validate-wrappers: 'false'

      - name: Assert action succeeded or failed gracefully with cache-disabled
        env:
          GRADLE_VERSION: ${{ steps.setup.outputs.gradle-version }}
          OUTCOME: ${{ steps.setup.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "gradle-version: $GRADLE_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$GRADLE_VERSION" ]; then
              echo "FAIL: action succeeded but gradle-version output is empty"
              exit 1
            fi
            echo "PASS: gradle-version is '$GRADLE_VERSION' with cache-disabled=true"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (dist files may be missing in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert gradle is available on PATH (if action succeeded)
        env:
          OUTCOME: ${{ steps.setup.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            if ! command -v gradle &>/dev/null; then
              echo "FAIL: gradle not found on PATH after successful setup"
              exit 1
            fi
            echo "PASS: gradle is available at $(command -v gradle) with cache-disabled=true"
          else
            echo "PASS: skipping PATH check (action did not succeed)"
          fi
