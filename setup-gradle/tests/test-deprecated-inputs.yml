name: Test deprecated and cache encryption inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Generate cache encryption key
        id: gen-key
        run: |
          KEY=$(openssl rand -base64 16)
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
      - id: setup
        uses: .
        continue-on-error: true
        with:
          cache-disabled: true
          cache-encryption-key: ${{ steps.gen-key.outputs.key }}
          build-root-directory: '.'
          arguments: '--version'
      - name: Assert setup ran
        env:
          OUTCOME: ${{ steps.setup.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with deprecated inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
