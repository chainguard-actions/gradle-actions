name: Test dependency-graph filter inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          cache-disabled: true
          validate-wrappers: false
          dependency-graph: 'generate'
          dependency-graph-exclude-projects: ':test.*'
          dependency-graph-include-projects: ':app.*'
          dependency-graph-exclude-configurations: 'testRuntime.*'
          dependency-graph-include-configurations: 'runtimeClasspath'
          dependency-graph-continue-on-failure: true
        continue-on-error: true
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with dependency-graph filter inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
