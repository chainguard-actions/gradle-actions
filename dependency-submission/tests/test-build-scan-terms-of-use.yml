name: Test build-scan-terms-of-use-url and build-scan-terms-of-use-agree inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          build-scan-publish: 'true'
          build-scan-terms-of-use-url: 'https://gradle.com/terms-of-service'
          build-scan-terms-of-use-agree: 'yes'
          cache-disabled: 'true'
          dependency-graph-continue-on-failure: 'true'
      - name: Assert action ran (build-scan-terms-of-use inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BUILD_SCAN_URL: ${{ steps.action.outputs.build-scan-url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "build-scan-url: $BUILD_SCAN_URL"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or no Gradle wrapper)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
