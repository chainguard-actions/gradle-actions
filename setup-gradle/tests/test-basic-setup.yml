name: Test basic Gradle setup (wrapper)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: setup-gradle
        uses: .
        continue-on-error: true
        with:
          cache-disabled: true

      - name: Assert setup-gradle step ran
        env:
          OUTCOME: ${{ steps.setup-gradle.outcome }}
          GRADLE_VERSION: ${{ steps.setup-gradle.outputs.gradle-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "gradle-version output: '$GRADLE_VERSION'"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: setup-gradle step completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: setup-gradle step ran and failed gracefully (dist may not be built)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
