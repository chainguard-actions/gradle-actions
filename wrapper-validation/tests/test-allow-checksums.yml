name: Test allow-checksums with custom checksum
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        with:
          min-wrapper-count: '1'
          allow-snapshots: 'false'
          allow-checksums: 'e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855'
        continue-on-error: true
      - name: Assert action ran with custom checksum
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FAILED_WRAPPER: ${{ steps.action.outputs.failed-wrapper }}
        run: |
          echo "outcome: $OUTCOME"
          echo "failed-wrapper: $FAILED_WRAPPER"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action accepted the custom checksum and validated successfully"
          elif [ "$OUTCOME" = "failure" ] || [ -z "$OUTCOME" ]; then
            echo "PASS: action ran with allow-checksums input and reported a result (expected in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
