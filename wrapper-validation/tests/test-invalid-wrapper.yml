name: Test invalid wrapper jar is detected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create an invalid gradle-wrapper.jar
        run: |
          rm -rf "$GITHUB_WORKSPACE"/acttest-*
          mkdir -p "$GITHUB_WORKSPACE/acttest-invalid/gradle/wrapper"
          echo "this is definitely not a real gradle wrapper jar" > "$GITHUB_WORKSPACE/acttest-invalid/gradle/wrapper/gradle-wrapper.jar"
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert action failed and reported the invalid wrapper
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FAILED: ${{ steps.action.outputs.failed-wrapper }}
        run: |
          echo "outcome: $OUTCOME"
          echo "failed-wrapper: $FAILED"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure outcome"
            exit 1
          fi
          if ! echo "$FAILED" | grep -q "acttest-invalid/gradle/wrapper/gradle-wrapper.jar"; then
            echo "FAIL: failed-wrapper does not include the invalid jar path"
            exit 1
          fi
          echo "PASS"
      - name: Cleanup
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE"/acttest-*
