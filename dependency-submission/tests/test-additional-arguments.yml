name: Test additional-arguments input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up minimal Gradle project
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-project/gradle/wrapper"
          cd "$GITHUB_WORKSPACE/test-project"

          printf 'rootProject.name = "args-test-project"\n' > settings.gradle

          printf 'plugins {\n    id "java"\n}\nrepositories {\n    mavenCentral()\n}\ndependencies {\n    implementation "com.google.guava:guava:31.1-jre"\n}\n' > build.gradle

          printf 'distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\ndistributionUrl=https\\://services.gradle.org/distributions/gradle-8.5-bin.zip\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\n' > gradle/wrapper/gradle-wrapper.properties

          printf '#!/bin/sh\nexec gradle "$@"\n' > gradlew
          chmod +x gradlew

      - id: action
        uses: .
        continue-on-error: true
        with:
          build-root-directory: test-project
          gradle-version: '8.5'
          dependency-graph: generate-and-upload
          dependency-graph-continue-on-failure: true
          additional-arguments: '--no-configuration-cache --stacktrace'
          cache-disabled: true
          add-job-summary: never
          artifact-retention-days: 1

      - name: Assert action ran with additional arguments
        env:
          OUTCOME: ${{ steps.action.outcome }}
          GRADLE_VERSION: ${{ steps.action.outputs.gradle-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "gradle-version: $GRADLE_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with additional arguments"
            if [ -n "$GRADLE_VERSION" ]; then
              echo "PASS: gradle-version output is '$GRADLE_VERSION'"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo or network issues)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
