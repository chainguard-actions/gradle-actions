name: Test cache-encryption-key input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up minimal Gradle project
        run: |
          mkdir -p "$GITHUB_WORKSPACE/_test-project/gradle/wrapper"
          cp "$GITHUB_WORKSPACE/hardened/tests/fixtures/gradle-project/build.gradle" "$GITHUB_WORKSPACE/_test-project/"
          cp "$GITHUB_WORKSPACE/hardened/tests/fixtures/gradle-project/settings.gradle" "$GITHUB_WORKSPACE/_test-project/"
          cp "$GITHUB_WORKSPACE/hardened/tests/fixtures/gradle-project/gradle/wrapper/gradle-wrapper.properties" "$GITHUB_WORKSPACE/_test-project/gradle/wrapper/"
      - id: action
        uses: .
        continue-on-error: true
        with:
          build-root-directory: _test-project
          cache-encryption-key: dGVzdGtleWZvcmVuY3J5cHRpb24xMjM=
          dependency-graph: generate-and-upload
          dependency-graph-continue-on-failure: true
          cache-disabled: true
      - name: Assert action ran (cache-encryption-key accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
