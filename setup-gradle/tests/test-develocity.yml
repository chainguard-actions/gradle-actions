name: Test Develocity configuration inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          cache-disabled: 'true'
          validate-wrappers: 'false'
          develocity-access-key: 'test-access-key'
          develocity-token-expiry: '4'
          develocity-injection-enabled: 'false'
          develocity-url: 'https://develocity.example.com'
          develocity-allow-untrusted-server: 'false'
          develocity-capture-file-fingerprints: 'false'
          develocity-enforce-url: 'false'
          develocity-plugin-version: '3.16'
          develocity-ccud-plugin-version: '1.13'
        continue-on-error: true
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.setup.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
