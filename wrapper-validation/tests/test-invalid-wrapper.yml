name: Test invalid gradle-wrapper.jar fails validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify committed fixture wrapper exists
        run: |
          if [ ! -f "tests/fixtures/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "FAIL: fixture gradle-wrapper.jar not found"
            exit 1
          fi
          echo "Fixture gradle-wrapper.jar found (empty file, unknown checksum)"
          sha256sum tests/fixtures/gradle/wrapper/gradle-wrapper.jar
      - id: action
        uses: .
        with:
          min-wrapper-count: '1'
          # No allow-checksums: the empty file checksum is not in Gradle's known list
          # so validation should fail
        continue-on-error: true
      - name: Assert action failed and failed-wrapper output is set
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FAILED: ${{ steps.action.outputs.failed-wrapper }}
        run: |
          echo "outcome: $OUTCOME"
          echo "failed-wrapper: '$FAILED'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for invalid wrapper, but got outcome: $OUTCOME"
            exit 1
          fi
          if [ -z "$FAILED" ]; then
            echo "FAIL: expected failed-wrapper output to be set but it was empty"
            exit 1
          fi
          echo "PASS: action correctly failed and reported failed wrapper: $FAILED"
