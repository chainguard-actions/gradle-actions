name: Test allow-snapshots input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        with:
          min-wrapper-count: '1'
          allow-snapshots: 'true'
          allow-checksums: ''
        continue-on-error: true
      - name: Assert action ran with allow-snapshots enabled
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FAILED_WRAPPER: ${{ steps.action.outputs.failed-wrapper }}
        run: |
          echo "outcome: $OUTCOME"
          echo "failed-wrapper: $FAILED_WRAPPER"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with allow-snapshots=true"
          elif [ "$OUTCOME" = "failure" ] || [ -z "$OUTCOME" ]; then
            echo "PASS: action ran with allow-snapshots=true and reported a result (expected in harness - no real gradle-wrapper.jar)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
