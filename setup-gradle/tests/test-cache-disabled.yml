name: Test Gradle setup with cache disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: setup-gradle
        uses: .
        continue-on-error: true
        with:
          gradle-version: '8.6'
          cache-disabled: 'true'

      - name: Assert setup-gradle step ran with cache-disabled
        env:
          OUTCOME: ${{ steps.setup-gradle.outcome }}
          GRADLE_VERSION: ${{ steps.setup-gradle.outputs.gradle-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "gradle-version output: '$GRADLE_VERSION'"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$GRADLE_VERSION" ]; then
              echo "FAIL: action succeeded but gradle-version output is empty"
              exit 1
            fi
            echo "PASS: setup-gradle completed with cache-disabled=true, version='$GRADLE_VERSION'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: setup-gradle ran and failed gracefully (dist may not be built)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
