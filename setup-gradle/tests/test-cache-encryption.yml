name: Test cache-encryption-key and cache-excludes inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          cache-encryption-key: 'dGVzdGtleXRlc3RrZXl0ZXN0a2V5dGVzdA=='
          gradle-home-cache-excludes: |
            caches/build-cache-*
            caches/keyrings
          cache-disabled: false
          cache-read-only: true
          validate-wrappers: false
      - name: Assert setup completed
        run: |
          echo "PASS: setup-gradle completed with cache-encryption-key and gradle-home-cache-excludes"
